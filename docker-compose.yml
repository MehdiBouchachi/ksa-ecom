# Saudi e-commerce — one command, zero configuration (local / demo / staging):
#
#   docker compose up -d --build
#   docker compose logs app | grep -A4 "ADMIN ACCOUNT"     # first-boot admin password
#
# Store  http://localhost:3000   ·  Admin  http://localhost:3000/admin
# Emails http://localhost:8025   (Mailpit catches every outgoing email locally)
#
# Secrets (DB password, AUTH_SECRET, CRON_SECRET, webhook secret, admin password) are generated
# on first boot into private volumes. Nothing secret lives in this file, the image, or git.
# Payments/shipping are SANDBOX SIMULATORS here. Production: see docker-compose.prod.yml.

name: saudi-ecom

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # One-shot: creates random secrets in a private volume on first boot (never overwrites).
  secrets:
    image: saudi-ecom:latest
    pull_policy: never # built by the "app" service
    entrypoint: ["node", "/app/docker/init-secrets.mjs"]
    healthcheck: { disable: true }
    volumes: [app-secrets:/run/app-secrets]
    network_mode: none
    read_only: true
    <<: *hardening
    restart: "no"

  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/app-secrets/db_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - app-secrets:/run/app-secrets:ro
    networks: [backend]
    depends_on:
      secrets: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt: ["no-new-privileges:true"]
    shm_size: 256mb
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        APP_URL: ${APP_URL:-http://localhost:3000}
        MEDIA_PUBLIC_HOST: ${MEDIA_PUBLIC_HOST:-}
    image: saudi-ecom:latest
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "${APP_PORT:-3000}:3000"
    # Local defaults below; production overrides them in docker-compose.prod.yml / .env.production.
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      ALLOW_INDEXING: ${ALLOW_INDEXING:-false}
      SEED_DEMO: ${SEED_DEMO:-1}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      ALLOW_MOCK_PAYMENTS: ${ALLOW_MOCK_PAYMENTS:-1}
      SHIPPING_PROVIDER: ${SHIPPING_PROVIDER:-aramex-mock}
      ALLOW_MOCK_SHIPPING: ${ALLOW_MOCK_SHIPPING:-1}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-Store <no-reply@example.com>}
      STAFF_ALERT_EMAIL: ${STAFF_ALERT_EMAIL:-ops@example.com}
      MEDIA_PUBLIC_HOST: ${MEDIA_PUBLIC_HOST:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    volumes:
      - app-data:/data
      - app-secrets:/run/app-secrets:ro
    networks: [backend, frontend]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web/.next/cache:size=256m,mode=1777
    <<: *hardening
    pids_limit: 512
    mem_limit: 1g
    restart: unless-stopped

  # Replaces Hostinger hPanel cron: signed calls to /api/v1/cron/* (outbox, reconcile, shipping-sync).
  cron:
    image: saudi-ecom:latest
    pull_policy: never
    entrypoint: ["node", "/app/docker/cron.mjs"]
    healthcheck: { disable: true } # the image healthcheck probes the web server
    depends_on:
      app: { condition: service_healthy }
    volumes: [app-secrets:/run/app-secrets:ro]
    networks: [backend]
    init: true
    read_only: true
    <<: *hardening
    mem_limit: 128m
    restart: unless-stopped

  # Local email catcher (UI on 127.0.0.1:8025). Disabled in production.
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ["127.0.0.1:8025:8025"]
    networks: [backend, frontend]
    <<: *hardening
    restart: unless-stopped

networks:
  backend:
    internal: true # database + cron + mail are never reachable from outside
  frontend: {}

volumes:
  pgdata: {}
  app-data: {}
  app-secrets: {}
